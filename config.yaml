paths:
  dataset: data/H2.csv
seed: 100
split:
  test_size: 0.2
features:
  regression:
    target: ADR
    numerical:
      - LeadTime
      - ArrivalDateYear
      - ArrivalDateWeekNumber
      - ArrivalDateDayOfMonth
      - StaysInWeekendNights
      - StaysInWeekNights
      - Adults
      - Children
      - Babies
      - IsRepeatedGuest
      - PreviousCancellations
      - PreviousBookingsNotCanceled
    categorical:
      - ArrivalDateMonth
      - Meal
      - MarketSegment
      - DistributionChannel
      - ReservedRoomType
      - DepositType
      - CustomerType
    drop:
      - IsCanceled
      - ReservationStatus
      - ReservationStatusDate
      - AssignedRoomType
      - BookingChanges
      - DaysInWaitingList
      - RequiredCarParkingSpaces
      - TotalOfSpecialRequests
  classification:
    target: null
    numerical: []
    categorical: []
    drop: []
  clustering:
    target: null
    numerical: []
    categorical: []
    drop: []